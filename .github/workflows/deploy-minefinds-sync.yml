name: Deploy MineFinds Sync

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/minefinds-sync/**'
      - '.github/workflows/deploy-minefinds-sync.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require Supabase access token
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in this repository."
            exit 2
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy minefinds-sync
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy minefinds-sync \
            --project-ref jytglrhvkzbsfpizjtrp \
            --no-verify-jwt

      - name: Verify live endpoint
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            body="$(curl -fsS --max-time 15 https://jytglrhvkzbsfpizjtrp.supabase.co/functions/v1/minefinds-sync || true)"
            if echo "$body" | grep -Fq '"service":"minefinds-sync"'; then
              echo "$body"
              exit 0
            fi
            sleep 5
          done
          echo "minefinds-sync did not become reachable after deployment"
          exit 1

      - name: Two-device share-code smoke test
        shell: bash
        run: |
          set -euo pipefail
          endpoint='https://jytglrhvkzbsfpizjtrp.supabase.co/functions/v1/minefinds-sync'
          d1="$(cat /proc/sys/kernel/random/uuid)"
          d2="$(cat /proc/sys/kernel/random/uuid)"
          world="$(cat /proc/sys/kernel/random/uuid)"
          s1="$(openssl rand -hex 32)"
          s2="$(openssl rand -hex 32)"
          now="$(date +%s%3N)"

          call() {
            local device="$1" secret="$2" body="$3"
            curl -fsS --max-time 20 \
              -H 'Content-Type: application/json' \
              -H "X-MineFinds-Device: $device" \
              -H "X-MineFinds-Secret: $secret" \
              -d "$body" "$endpoint"
          }

          echo '1/5 register first device'
          r="$(call "$d1" "$s1" '{"op":"register"}')"
          echo "$r"
          echo "$r" | jq -e '.ok == true' >/dev/null

          echo '2/5 create shared world'
          r="$(call "$d1" "$s1" "{\"op\":\"create_world\",\"display_name\":\"SmokeA\",\"world\":{\"id\":\"$world\",\"name\":\"MineFinds smoke test\",\"seed\":\"123\",\"edition\":\"Bedrock\",\"minecraft_version\":\"26.2\",\"dimension\":\"Overworld\",\"created_at\":$now,\"updated_at\":$now}}")"
          echo "$r"
          echo "$r" | jq -e '.ok == true and .world.id == $w' --arg w "$world" >/dev/null

          echo '3/5 generate share code'
          r="$(call "$d1" "$s1" "{\"op\":\"share_world\",\"world_id\":\"$world\"}")"
          echo "$r"
          code="$(echo "$r" | jq -r '.join_code // empty')"
          test "${#code}" -eq 8
          echo "Share code generated: $code"

          echo '4/5 register second device'
          r="$(call "$d2" "$s2" '{"op":"register"}')"
          echo "$r"
          echo "$r" | jq -e '.ok == true' >/dev/null

          echo '5/5 join second device using share code'
          r="$(call "$d2" "$s2" "{\"op\":\"join_world\",\"join_code\":\"$code\",\"display_name\":\"SmokeB\"}")"
          echo "$r"
          echo "$r" | jq -e '.ok == true and .world.id == $w and (.players | length) >= 2' --arg w "$world" >/dev/null
          echo 'MineFinds two-device share-code smoke test PASSED'
