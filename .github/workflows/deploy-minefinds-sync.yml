name: Deploy MineFinds Sync

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'supabase/functions/minefinds-sync/**'
      - '.github/workflows/deploy-minefinds-sync.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Require Supabase access token
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in this repository."
            exit 2
          fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy minefinds-sync
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy minefinds-sync \
            --project-ref jytglrhvkzbsfpizjtrp \
            --no-verify-jwt

      - name: Verify live endpoint
        shell: bash
        run: |
          for i in 1 2 3 4 5 6; do
            body="$(curl -fsS --max-time 15 https://jytglrhvkzbsfpizjtrp.supabase.co/functions/v1/minefinds-sync || true)"
            if echo "$body" | grep -Fq '"service":"minefinds-sync"'; then
              echo "$body"
              exit 0
            fi
            sleep 5
          done
          echo "minefinds-sync did not become reachable after deployment"
          exit 1

# retrigger after configuring SUPABASE_ACCESS_TOKEN
