name: Build MineFinds APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Reconstruct MineFinds source
        shell: bash
        run: |
          cat .payload/project.b64.part* > project.b64
          echo "4cf59d6f72d604d1d0a91a362b88397a4dc8f6276907523a2ed0e822854379b9  project.b64" | sha256sum -c - || true
          base64 -d project.b64 > project.tar.gz
          tar -xzf project.tar.gz

      - name: Fix world version field
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/hailey/minefinds/MainActivity.java')
          s = p.read_text()
          old = 'Spinner edition = spinner(new String[]{"Bedrock","Java"}); EditText version = field("26.2"); Spinner dimension = spinner(new String[]{"Overworld","Nether","The End"});'
          new = 'Spinner edition = spinner(new String[]{"Bedrock","Java"}); EditText version = field(""); version.setText("26.2"); Spinner dimension = spinner(new String[]{"Overworld","Nether","The End"});'
          if old not in s and new not in s:
              raise SystemExit('Version field source pattern not found')
          p.write_text(s.replace(old, new))
          PY
          grep -F 'version.setText("26.2")' app/src/main/java/com/hailey/minefinds/MainActivity.java

      - name: Install stable MineFinds signing key
        shell: bash
        run: |
          mkdir -p signing
          echo '' | base64 -d > signing/minefinds.keystore
          keytool -list -keystore signing/minefinds.keystore -storepass 'MineFinds26Local!' -alias minefinds >/dev/null

      - name: Configure stable-signed app version
        shell: bash
        run: |
          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hailey.minefinds'
              compileSdk 35

              signingConfigs {
                  mineFindsStable {
                      storeFile file('../signing/minefinds.keystore')
                      storePassword 'MineFinds26Local!'
                      keyAlias 'minefinds'
                      keyPassword 'MineFinds26Local!'
                  }
              }

              defaultConfig {
                  applicationId 'com.hailey.minefinds'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '1.0.1'
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.mineFindsStable
                  }
              }
          }
          EOF

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Run MineFinds core behavior tests
        run: |
          mkdir -p core-test-classes
          javac -d core-test-classes \
            app/src/main/java/com/hailey/minefinds/DistanceUtils.java \
            app/src/main/java/com/hailey/minefinds/SeedMapUrl.java \
            app/src/test/java/com/hailey/minefinds/CoreBehaviorTest.java
          java -cp core-test-classes com.hailey.minefinds.CoreBehaviorTest
          grep -F 'version.setText("26.2")' app/src/main/java/com/hailey/minefinds/MainActivity.java

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build installable debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK and signing certificate
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee apk-cert.txt
          grep -qi '50d71ad0f4a4c0a68979557a09f62f77e88f0049745c5e6f88a2811c59c08ad5' apk-cert.txt

      - name: Upload MineFinds APK
        uses: actions/upload-artifact@v4
        with:
          name: MineFinds-APK-v1.0.1
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
